<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Book Event - Idhal Balloons</title>  
<link rel="stylesheet" href="style.css">  
</head>  
<body>

<header class="header">  
  <div class="logo">  
    <img src="logo.png" alt="Idhal Balloons">  
  </div>  
  <h2>Book Your Event 🎈</h2>  
</header>  

<section class="booking">  

<form class="booking-form" id="bookingForm">    

  <input type="text" id="name" placeholder="Full Name" required>    
  
  <input type="tel" id="phone" placeholder="Phone Number" required>    
  
  <input type="email" id="email" placeholder="Email Address" required>    

  <select id="eventType" required>  
    <option value="">Select Event Type</option>  
    <option>Birthday</option>  
    <option>Wedding</option>  
    <option>Baby Shower</option>  
    <option>Anniversary</option>  
  </select>  

  <input type="date" id="date" required>  

  <input type="text" id="location" placeholder="Event Location" required>    

  <textarea id="message" placeholder="Decoration Details / Message"></textarea> 

  <button type="submit">Book Now</button>

  <a href="https://wa.me/919999999999" class="whatsapp">Chat on WhatsApp</a>
  <a href="index.html" class="home">Home</a>

</form>  

</section>  

<script type="module" src="script.js"></script>  

</body>  
</html>
